<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Pokedex</title>
        <link rel="icon" href="./assets/images/pokeball.png" type="image/png" />
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <div class="header">
            <img src="./assets/images/logo.png" class="logo" />
        </div>
        <div class="body">
            <button id="button" class="button">Let's go!</button>
            <div hidden id="progressText"></div>
            <progress hidden id="loadingBar" max="151" value="0"></progress>
            <form hidden id="formulario-busqueda" class="buscador">
                <label for="busqueda">Nombre o número</label>
                <div class="buscador__controles">
                    <input
                        id="busqueda"
                        name="busqueda"
                        type="text"
                        placeholder="Ejemplo: pikachu o 25"
                        autocomplete="off"
                    />
                    <button type="submit">Buscar</button>
                </div>
            </form>
        </div>
        <div id="pokedex"></div>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
